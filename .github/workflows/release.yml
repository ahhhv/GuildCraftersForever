# Publishes the addon to CurseForge (and as a GitHub release) automatically.
#
# The version comes from the first "## x.y.z" heading of CHANGELOG.md. When a push to
# main brings a version that has no tag yet, this workflow tags the commit
# ("v" + version) and packages it:
#   ## 0.4.0         -> Release
#   ## 0.4.0-beta1   -> Beta
#   ## 0.4.0-alpha1  -> Alpha
# Pushing a "v*" tag by hand still works too.
# The game version (WoW: Forever 1.60.x) comes from the .toc's "## Interface: 16xxx".
# Needs the repository secret CF_API_KEY (a CurseForge API token).
name: Package and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag a new version from CHANGELOG.md
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver=$(grep -m1 -oP '^##\s+v?\K[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.]+)?' CHANGELOG.md || true)
          if [ -z "$ver" ]; then
            echo "No version heading in CHANGELOG.md; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Package and upload
        if: steps.version.outputs.publish == 'true'
        uses: BigWigsMods/packager@v2
