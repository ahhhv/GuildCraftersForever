# Publishes the addon to CurseForge (and as a GitHub release) automatically.
#
# The version comes from the first "## x.y.z" heading of CHANGELOG.md. When a push to
# main brings a version that has no tag yet, the "tag" job tags the commit
# ("v" + version) and starts this workflow again on that tag, which packages it:
#   ## 0.4.0         -> Release
#   ## 0.4.0-beta1   -> Beta
#   ## 0.4.0-alpha1  -> Alpha
# Pushing a "v*" tag by hand still works too.
# The game version (WoW: Forever 1.60.x) comes from the .toc's "## Interface: 16xxx".
# Needs the repository secret CF_API_KEY (a CurseForge API token).
name: Package and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag a new version from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(grep -m1 -oP '^##\s+v?\K[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.]+)?' CHANGELOG.md || true)
          if [ -z "$ver" ]; then
            echo "No version heading in CHANGELOG.md; nothing to publish."
            exit 0
          fi
          tag="v$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
          echo "Tagged $tag and started its release."

  package:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
